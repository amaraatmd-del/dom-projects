<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
<link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  <body class="min-h-screen min-w-[1000px] bg-[#101b16] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#86efac]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#86efac]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#86efac] transition-colors hover:border-[#86efac]/35 hover:bg-[#86efac]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#86efac] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#86efac]/65">The everyday collection / 02</span>
      </header>

  <div class="flex flex-1 items-center justify-center py-10">
      <!-- Endees ehel -->
  
  <body class="flex min-h-screen items-center justify-center bg-[#101b16] font-sans text-[#f0fdf4]">
    <div class="w-[520px] rounded-[24px] border border-white/10 bg-[#192B22] p-12">

      <div class="mb-8 flex h-14 w-16 items-center justify-center rounded-[16px] bg-[#4ADE80]/15 text-[#4ADE80]">
        <i class="fa-solid fa-lock"></i>
      </div>

      <div class="text-[28px] font-semibold">Password generator</div>
      <div class="mt-2 text-[14px] text-[#A4B9AD]">A strong password. One click away.</div>

      <div class="mt-10 text-[12px] text-[#A4B9AD]">Your password</div>

      <div class="mt-3 flex h-[64px] items-center gap-3 rounded-[12px] border border-white/10 bg-[#101B16] px-6">
        <input id="showGeneratedPassword" type="text" 
          class="w-full bg-transparent font-mono text-[18px] text-[#BBF7D0] outline-none" />
        <button id="copyGeneratedPassword" type="button"
          class="h-[31px] rounded-[8px] bg-white/5 px-4 text-[12px] hover:bg-white/10">
          Copy
        </button>
      </div>

      <div id="message" class="mt-3 text-[12px] text-[#A4B9AD]">
        Uses letters and numbers.
      </div>

      <div class="mt-8 flex justify-between">
        <div class="text-[14px] text-[#DCECE2]">Password length</div>
        <div id="passwordLengthOutput" class="text-[20px] text-[#4ADE80]">16</div>
      </div>

      <input id="passwordLengthRangeInput" type="range" min="8" max="24" value="16"
        class="mt-5 w-full accent-[#4ADE80]" />

      <div class="flex justify-between text-[12px] text-[#A4B9AD]">
        <div>8</div>
        <div>24</div>
      </div>

      <button id="generatePassword" type="button"
        class="mt-8 h-[64px] w-full rounded-[12px] bg-[#4ADE80] text-[16px] font-semibold text-[#101B16] hover:bg-[#86efac]">
        Generate password
      </button>

      <div class="mt-4 text-center text-[12px] text-[#A4B9AD]">
        Generated in your browser. Never saved.
      </div>
    </div>
  </body>
</html>
