  <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
  </head>

  <body class="flex min-h-screen items-center justify-center bg-[#101B16] font-sans text-[#F0FDF4]">
    <div class="w-[520px] rounded-[24px] border border-white/10 bg-[#192B22] p-12">
      <div class="mb-8 flex h-14 w-16 items-center justify-center rounded-[16px] bg-[#4ADE80]/15 text-[#4ADE80]">
      <i class="fa-solid fa-lock"></i>
      </div>
      <div class="asd">
        <div class="text-[28px] font-semibold text-[#F0FDF4]">Password generator</div>
        <div class="mt-2 text-[14px] text-[#A4B9AD]">A strong password. One click away.</div>
      </div>
      <div class="mt-10 text-[12px] text-[#A4B9AD]">Your password</div>
      <div class="mt-3 flex h-[64px] w-full items-center justify-between rounded-[12px] border border-white/10 bg-[#101B16] px-6  font-roboto mono text-[18px] text-[#BBF7D0]">
        <div>K9#mQ2@xR7!vN4@p</div>
        <div class="flex h-[31px] items-center rounded-[8px] bg-white/5 px-4 font-inter text-[12px] text-[#F0FDF4]">
          Copy
        </div>
      </div>
      <div class="mt-3 text-[12px] text-[#A4B9AD]">Uses letters, numbers, and symbols.</div>
      <div class="mt-8 flex items-center justify-between">
        <div class="text-[14px] text-[#DCECE2]">Password length</div>
        <div class="text-[20px] text-[#4ADE80]">16</div>
      </div>
      <div class="relative mt-5 h-[6px] w-full rounded-full bg-[#52665A]">
        <div class="h-full w-[50%] rounded-full bg-[#4ADE80]"></div>
        <div class="absolute left-1/2 top-1/2 h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#4ADE80]"></div>
      </div>
      <div class="mt-3 flex justify-between text-[12px] text-[#A4B9AD]">
        <div>8</div>
        <div>24</div>
      </div>
      <div class="mt-8 flex h-[64px] w-full items-center justify-center rounded-[12px] bg-[#4ADE80] text-[16px] font-semibold text-[#101B16]">
        Generate password
      </div>
      <div class="mt-4 text-center text-[12px] text-[#A4B9AD]">
        Generated in your browser. Never saved.
      </div>

    </div>
  </body>
</html>
</html>
