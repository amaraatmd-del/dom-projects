<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

<div class="flex flex-1 items-center justify-center py-10">
        <!-- Endees ehel -->
        <div class="flex flex-1 items-center justify-center py-10">
        <div class="w-full max-w-[576px] rounded-[24px] border border-white/10 bg-[#18181B] p-8 sm:p-12">
          <div class="text-[28px] font-semibold">Reaction time</div>
          <div class="mt-2 text-[14px] text-[#A1A1AA]">Wait for green, then click as quickly as you can.</div>

          <button
            id="second"
            type="button"
            class="mt-6 flex h-[240px] w-full cursor-pointer select-none flex-col items-center justify-center gap-2 rounded-[24px] bg-[#27272A] text-[#F4F4F5] transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d]"
          >
            <div id="icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <div id="title" class="text-[26px] font-semibold">Ready when you are</div>
            <div id="subtitle" class="text-[16px]">Click to start</div>
          </button>

          <div class="mt-4 grid grid-cols-2 gap-3">
            <div class="rounded-[18px] bg-[#27272A] px-3 py-5 text-center">
              <div id="last" class="text-[22px] font-semibold leading-[30px] text-[#E8F5A5]">—</div>
              <div class="mt-1.5 text-[14px] text-[#A1A1AA]">Last attempt</div>
            </div>
            <div class="rounded-[18px] bg-[#27272A] px-3 py-5 text-center">
              <div id="best" class="text-[22px] font-semibold leading-[30px] text-[#E8F5A5]">—</div>
              <div class="mt-1.5 text-[14px] text-[#A1A1AA]">Best this session</div>
            </div>
          </div>

          <div class="mx-2 mt-5 text-center text-[12px] leading-relaxed text-[#A1A1AA]">
            Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
